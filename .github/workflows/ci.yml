name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  latex:
    name: LaTeX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Compile document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: src
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          extra_system_packages: py3-pygments
      - name: Upload PDF
        uses: actions/upload-artifact@v6
        with:
          name: xcpc-handbook
          path: src/main.pdf

  cpp:
    name: C++ standards and warnings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compile and run C++ test units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci/validate_code.py cpp --base "$BASE_SHA"

  gtest-contract:
    name: C++ GoogleTest (contract + ASan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S tests -B build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DXCPC_SANITIZE=ON -DXCPC_DEATH_TESTS=OFF
      - name: Build
        run: cmake --build build/tests -j
      - name: Test
        run: ctest --test-dir build/tests --output-on-failure --timeout 60

  gtest-guards:
    name: C++ GoogleTest (assertion guards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S tests -B build/guards -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXCPC_SANITIZE=OFF -DXCPC_DEATH_TESTS=ON
      - name: Build
        run: cmake --build build/guards -j
      - name: Test
        run: ctest --test-dir build/guards --output-on-failure --timeout 30

  gtest-sync:
    name: C++ test coverage map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check adapter coverage
        run: python3 tests/sync/check_adapters.py

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        env:
          PYTHONWARNINGS: error
        run: python tools/ci/validate_code.py python --target "${{ matrix.python-version }}"
